name: X daily search
# Searches X once a day for the queries in data/x-search-queries.json (capped at 200 posts) and writes the
# results to a Google Sheet in the "Even Steven Growth" Drive folder. Uses the read-only X app.
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Search and print the first rows; write nothing to Drive'
        type: boolean
        default: false

concurrency:
  group: x-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node --test scripts/x-search.test.mjs
      - run: node scripts/x-search.mjs
        env:
          X_READ_BEARER_TOKEN: ${{ secrets.X_READ_BEARER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
