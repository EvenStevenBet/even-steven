name: Market Opener Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only pass: evaluate rows, log intentions, deploy nothing (defaults true so manual runs never go live)'
        type: boolean
        default: true

concurrency:
  group: market-opener
  cancel-in-progress: false  # never cancel a running deployment

permissions:
  contents: write  # required for CSV commit write-back
  actions: write   # dispatches kickoff-closer.yml after every new market

jobs:
  run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: market-opener-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install
      - run: npm start
        env:
          BOT_ENABLED: ${{ secrets.BOT_ENABLED }}
          # workflow_dispatch input wins over the secret; the secret is the scheduled-run default.
          # inputs.dry_run is absent (empty string) on schedule; the || chain falls through to the secret.
          # If neither is set the bot's own config defaults to true — safe by design.
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || secrets.DRY_RUN }}
          # A repository variable, not a secret: secrets mask every occurrence of their value in logs,
          # so a secret "3" hid every 3 in addresses and tx hashes. Unset = the bot's default (3).
          MAX_OPEN_MARKETS: ${{ vars.MAX_OPEN_MARKETS }}
          APPROVAL_TOKEN: ${{ secrets.APPROVAL_TOKEN }}
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRODUCTION_WALLET: ${{ secrets.PRODUCTION_WALLET }}
          FACTORY_ADDRESS: ${{ secrets.FACTORY_ADDRESS }}
          USDC_ADDRESS: ${{ secrets.USDC_ADDRESS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: EvenStevenBet
          GITHUB_REPO_NAME: even-steven
          GITHUB_CSV_PATH: data/markets.csv
          RECEIPT_TIMEOUT_MS: ${{ secrets.RECEIPT_TIMEOUT_MS }}
